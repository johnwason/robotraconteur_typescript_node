name: Docs

# Builds the documentation site on every push and pull request, failing on any TypeDoc warning, such
# as an undocumented export or a broken link. Pushes to dev publish it with GitHub Pages, which must
# be set to deploy from GitHub Actions in the repository settings.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.12.0
  # The branch of the shared package to build against
  RR_SHARED_REF: dev

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: robotraconteur_typescript_node
    steps:
    - uses: actions/checkout@v4
      with:
        path: robotraconteur_typescript_node
    - name: Checkout the shared package
      uses: actions/checkout@v4
      with:
        repository: johnwason/robotraconteur_typescript
        ref: ${{ env.RR_SHARED_REF }}
        path: robotraconteur_typescript
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Build the shared package
      working-directory: robotraconteur_typescript
      run: npm ci --ignore-scripts && npm run build
    - name: Install dependencies
      run: npm ci
    - name: Build the documentation
      run: npm run docs
    - name: Upload the site
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
      uses: actions/upload-pages-artifact@v3
      with:
        path: robotraconteur_typescript_node/docs-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Publish to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
