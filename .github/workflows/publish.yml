# Publishes to npm when a GitHub release is published in the robotraconteur organization, after the
# CI tests pass. The release's tag, such as v0.1.0, must match the version in package.json. The
# robotraconteur version it needs must already be on npm.
name: Publish

on:
  release:
    types:
    - published

permissions:
  contents: read

env:
  NODE_VERSION: 22.12.0
  # The branch of the shared package to build against
  RR_SHARED_REF: main

jobs:
  test:
    if: github.repository_owner == 'robotraconteur'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: robotraconteur_typescript_node
    steps:
    - uses: actions/checkout@v4
      with:
        path: robotraconteur_typescript_node
    - name: Checkout the shared package
      uses: actions/checkout@v4
      with:
        repository: robotraconteur/robotraconteur_typescript
        ref: ${{ env.RR_SHARED_REF }}
        path: robotraconteur_typescript
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        registry-url: https://registry.npmjs.org
    - name: Check that the tag matches the package version
      run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
    - name: Build the shared package
      working-directory: robotraconteur_typescript
      run: npm ci --ignore-scripts && npm run build
    - name: Install Node.js dependencies
      run: npm ci
    - name: Publish
      # prepack builds the package
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
