name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.12.0
  PYTHON_VERSION: "3.12"
  RR_CORE_VERSION: v1.2.9
  # Until the split is merged, this package needs this branch of the shared package
  RR_SHARED_REF: node-split

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RR_CORE_TEST: ${{ github.workspace }}/rr-core/test
    defaults:
      run:
        working-directory: robotraconteur_typescript_node
    steps:
    - uses: actions/checkout@v4
      with:
        path: robotraconteur_typescript_node
    - name: Checkout the shared package
      uses: actions/checkout@v4
      with:
        repository: johnwason/robotraconteur_typescript
        ref: ${{ env.RR_SHARED_REF }}
        path: robotraconteur_typescript
    - name: Checkout Robot Raconteur Core test services
      uses: actions/checkout@v4
      with:
        repository: robotraconteur/robotraconteur
        ref: ${{ env.RR_CORE_VERSION }}
        path: rr-core
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install Python dependencies
      run: python -m pip install "robotraconteur==${RR_CORE_VERSION#v}" numpy pytest
    - name: Build the shared package
      working-directory: robotraconteur_typescript
      run: npm ci --ignore-scripts && npm run build
    - name: Install Node.js dependencies
      run: npm ci
    - name: Test
      run: npm test
